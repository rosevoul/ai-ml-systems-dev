<svg width="1100" height="720" viewBox="0 0 1100 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Two-Tower plus XGBoost recommender architecture</title>
<desc id="desc">Architecture diagram showing MovieLens style events, feature store, user tower, item tower, candidate retrieval, XGBoost ranker, explanations, and evaluation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#111827"/><stop offset="1" stop-color="#1E293B"/></linearGradient>
  <linearGradient id="box" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#243B55"/><stop offset="1" stop-color="#141E30"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2L10 6L2 10" stroke="#93C5FD" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1100" height="720" rx="34" fill="url(#bg)"/>
<text x="64" y="70" fill="#F8FAFC" font-family="Inter, Arial" font-size="34" font-weight="800">Two-Tower + XGBoost Recommender Stack</text>
<text x="64" y="106" fill="#CBD5E1" font-family="Inter, Arial" font-size="18">MovieLens-style implicit feedback → embedding retrieval → ranker → explanations</text>

<g filter="url(#shadow)">
  <rect x="62" y="160" width="190" height="120" rx="22" fill="url(#box)" stroke="#334155"/>
  <text x="92" y="202" fill="#E0F2FE" font-family="Inter, Arial" font-size="18" font-weight="700">Events</text>
  <text x="92" y="234" fill="#CBD5E1" font-family="Inter, Arial" font-size="15">views</text>
  <text x="92" y="258" fill="#CBD5E1" font-family="Inter, Arial" font-size="15">ratings</text>
</g>
<g filter="url(#shadow)">
  <rect x="62" y="360" width="190" height="120" rx="22" fill="url(#box)" stroke="#334155"/>
  <text x="92" y="402" fill="#E0F2FE" font-family="Inter, Arial" font-size="18" font-weight="700">Feature Store</text>
  <text x="92" y="434" fill="#CBD5E1" font-family="Inter, Arial" font-size="15">user taste</text>
  <text x="92" y="458" fill="#CBD5E1" font-family="Inter, Arial" font-size="15">item metadata</text>
</g>

<g filter="url(#shadow)">
  <rect x="350" y="130" width="220" height="132" rx="24" fill="#172554" stroke="#3B82F6"/>
  <text x="388" y="176" fill="#DBEAFE" font-family="Inter, Arial" font-size="20" font-weight="800">User Tower</text>
  <text x="388" y="210" fill="#BFDBFE" font-family="Inter, Arial" font-size="15">history → user embedding</text>
</g>
<g filter="url(#shadow)">
  <rect x="350" y="388" width="220" height="132" rx="24" fill="#312E81" stroke="#818CF8"/>
  <text x="388" y="434" fill="#E0E7FF" font-family="Inter, Arial" font-size="20" font-weight="800">Item Tower</text>
  <text x="388" y="468" fill="#C7D2FE" font-family="Inter, Arial" font-size="15">movie metadata → item embedding</text>
</g>

<g filter="url(#shadow)">
  <rect x="660" y="214" width="200" height="148" rx="26" fill="#0F172A" stroke="#67E8F9"/>
  <text x="702" y="262" fill="#CFFAFE" font-family="Inter, Arial" font-size="20" font-weight="800">Candidate Retrieval</text>
  <text x="702" y="298" fill="#A5F3FC" font-family="Inter, Arial" font-size="15">dot product similarity</text>
  <text x="702" y="322" fill="#A5F3FC" font-family="Inter, Arial" font-size="15">top-K candidates</text>
</g>

<g filter="url(#shadow)">
  <rect x="660" y="454" width="200" height="126" rx="26" fill="#2E1065" stroke="#A78BFA"/>
  <text x="703" y="500" fill="#F3E8FF" font-family="Inter, Arial" font-size="20" font-weight="800">XGBoost Ranker</text>
  <text x="703" y="535" fill="#DDD6FE" font-family="Inter, Arial" font-size="15">CTR + relevance score</text>
</g>

<g filter="url(#shadow)">
  <rect x="922" y="264" width="132" height="96" rx="22" fill="#052E2B" stroke="#2DD4BF"/>
  <text x="949" y="306" fill="#CCFBF1" font-family="Inter, Arial" font-size="18" font-weight="800">Output</text>
  <text x="949" y="332" fill="#99F6E4" font-family="Inter, Arial" font-size="14">recommendations</text>
</g>
<g filter="url(#shadow)">
  <rect x="922" y="438" width="132" height="96" rx="22" fill="#3B1D0F" stroke="#FB923C"/>
  <text x="949" y="480" fill="#FFEDD5" font-family="Inter, Arial" font-size="18" font-weight="800">Explain</text>
  <text x="949" y="506" fill="#FED7AA" font-family="Inter, Arial" font-size="14">drivers + tradeoffs</text>
</g>

<path d="M252 220C285 220 310 196 350 196" stroke="#93C5FD" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M252 420C295 420 312 454 350 454" stroke="#93C5FD" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M570 196C615 196 620 276 660 286" stroke="#93C5FD" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M570 454C617 454 622 337 660 315" stroke="#93C5FD" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M760 362V454" stroke="#93C5FD" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M860 300C890 300 895 310 922 310" stroke="#93C5FD" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M860 517C895 517 898 487 922 487" stroke="#93C5FD" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M988 438V360" stroke="#93C5FD" stroke-width="3" marker-end="url(#arrow)"/>

<g opacity="0.9">
  <rect x="64" y="610" width="972" height="54" rx="18" fill="#0F172A" stroke="#334155"/>
  <text x="94" y="644" fill="#CBD5E1" font-family="Inter, Arial" font-size="15">Portfolio signal: retrieval, ranking, explainability, offline evaluation, online simulation, and model monitoring can be extended from this base.</text>
</g>
</svg>
